name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Question banks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Catches a half-wired topic: a bank file that does not exist, a topic
      # missing from DEFAULT_SETTINGS so it can never be enabled, or an icon
      # with no entry in the ICONS map. None of those throw at runtime.
      - name: Library wiring
        run: node scripts/check-library.mjs

      # The root data/ feed is what installed copies fetch daily. If it drifts
      # from desktop/ui the repo still looks correct while every install
      # quietly serves stale questions.
      - name: Sync feed is current
        run: node scripts/sync-feed.mjs --check

      # A module left out of a page, or a command implemented in only one
      # shell, both fail silently at runtime rather than at build time.
      # A syntax error in the shell shows a crash dialog and nothing else;
      # nothing else here parses main.js before it is packaged.
      - name: JavaScript parses
        run: node scripts/check-syntax.mjs

      # mobile/www is generated and gitignored, so build it then verify the
      # generator is deterministic. A stale copy would ship an old UI in the APK.
      - name: Mobile UI copy is reproducible
        run: |
          node scripts/build-mobile-www.mjs
          node scripts/build-mobile-www.mjs --check

      - name: UI module wiring
        run: node scripts/check-ui-scripts.mjs

      - name: Shell command parity
        run: node scripts/check-shell-parity.mjs

      - name: Unit tests
        run: node --test scripts/test/*.test.mjs

      # Without --require-source, because the questions written before sources
      # were required would otherwise fail. Generated content is validated
      # with the flag on, in expand-library.yml.
      - name: Validate every bank
        run: |
          fail=0
          for f in desktop/ui/data/*.json; do
            node scripts/validate-questions.mjs "$f" || fail=1
          done
          exit $fail

  app:
    name: Tauri build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri

      - name: Format
        working-directory: desktop/tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop/tauri
        run: cargo clippy --release -- -D warnings

      - name: Build
        working-directory: desktop/tauri
        run: cargo build --release
