<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kinvt-study — Quiz</title>
  <style>
    /* Bundled Poppins — same local files the sidecar uses. */
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14.5px/1.55 'KinvtPoppins', 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f5f1dd;
      background: #1c1b19;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 16px;
    }
    .win-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 12px;
    }
    .win-logo {
      width: 26px; height: 26px; border-radius: 7px; flex: none;
      background: #f5f1dd;
      color: #1c1b19;
      display: grid; place-items: center;
    }
    .win-logo svg { width: 15px; height: 15px; }
    .win-name { font-weight: 700; font-size: 13.5px; letter-spacing: .2px; }
    .win-sub { font-size: 11px; opacity: .55; }
    .win-close {
      margin-left: auto; border: 0; background: rgba(245,241,221,.08);
      color: inherit; cursor: pointer;
      padding: 6px 10px; border-radius: 8px;
    }
    .win-close svg { display: block; width: 13px; height: 13px; }
    .win-close:hover { background: rgba(245,241,221,.16); }
    #card { width: 100%; max-width: 400px; flex: 1; }
    .empty {
      text-align: center; padding: 40px 16px;
      background: rgba(245,241,221,.06); border: 1px solid rgba(245,241,221,.14);
      border-radius: 18px;
    }
    .empty .ico { width: 40px; height: 40px; margin: 0 auto; color: #f5f1dd; opacity: .8; }
    .empty .ico svg { display: block; width: 100%; height: 100%; }
    .empty p { opacity: .75; margin: 10px 0 16px; }
    .empty button {
      border: 0; border-radius: 9px; padding: 10px 18px; cursor: pointer;
      font: inherit; font-weight: 700; color: #1c1b19;
      background: #f5f1dd;
    }
    .empty button:hover { background: #ffffff; }
  </style>
</head>
<body>
  <div class="win-bar">
    <div class="win-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg></div>
    <div>
      <div class="win-name">Kinvt-study</div>
      <div class="win-sub">local quiz · no AI · no network</div>
    </div>
    <button type="button" class="win-close" id="closeWin" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
  </div>
  <div id="card"></div>
  <script src="ui-core.js"></script>
  <script src="quiz-window.js"></script>
</body>
</html>
