[package]
name = "kinvt-study"
version = "1.0.0"
description = "Translucent MCQ quiz popups for competitive-exam prep — local-first, no AI"
authors = ["Vinayaka"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opening a source URL in the real browser; a few hundred lines rather than a
# plugin, since that is the entire requirement.
open = "5"

# Painting the title bar to match the app background is a Windows-only DWM
# call, so the dependency is target-gated rather than carried everywhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }

[profile.release]
# A study popup has no business being a large download or holding memory it
# does not need. These are the standard size-first settings.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
