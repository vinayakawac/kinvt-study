<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kinvt-study</title>
  <style>
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }

    * { box-sizing: border-box; }

    /* The window itself is transparent, so the page must not paint a
       background — otherwise the "transparent" window shows up as an opaque
       rectangle. Only the card paints, and it paints its own glass. */
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font: 14.5px/1.55 'KinvtPoppins','Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      /* The window has no title bar, so the card's header doubles as the
         drag handle (see .tpq-head below). */
      user-select: none;
      cursor: default;
    }

    /* Small inset so the rounded corners aren't shaved by the window edge.
       Kept tight: every transparent pixel here is window area, and anything
       painted in it shows as a rectangle. */
    #card { padding: 6px; }
    /* Let the card's body expand instead of scrolling inside a fixed height. */
    /* flex:1 1 auto lets this shrink inside the card instead of growing it,
       so the Next button got laid out past the card's clipped bottom.
       flex:none makes the body take its natural height and the card grow. */
    #card .tpq-body { overflow: visible; max-height: none; flex: none; }

    /* Real desktop glass: unlike the browser popup window, this genuinely
       composites against whatever is behind the window. */
    #card .tpq-card {
      /* The window grows to fit, so the card must not cap or scroll itself —
         an inner scroll region would hide the Next button instead of the
         window simply getting taller. */
      max-height: none;
      height: auto;
      border-radius: 14px;
      /* No box-shadow. Over a transparent window WebView2 composites the
         shadow's alpha against nothing, so instead of a soft glow it paints
         a grey haze clipped to the window's rectangle. The window floats
         above everything anyway, so the shadow bought nothing. */
      box-shadow: none;
    }

    /* Frameless windows need an explicit drag region. */
    #card .tpq-head { -webkit-app-region: drag; }
    #card .tpq-head button { -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="ui-core.js"></script>
  <script src="quiet-hours.js"></script>
  <script src="merge.js"></script>
  <script src="storage.js"></script>
  <script src="progress.js"></script>
  <script src="selection.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="sync-crypto.js"></script>
  <script src="sync-pairing.js"></script>
  <script src="sync-session.js"></script>
  <script src="app.js"></script>
</body>
</html>
