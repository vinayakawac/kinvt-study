<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kinvt-study — Quiz Window Preview</title>
  <style>
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:400; font-display:swap; src:url('../src/fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:600; font-display:swap; src:url('../src/fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:700; font-display:swap; src:url('../src/fonts/poppins-700.woff2') format('woff2'); }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #1c1b19; color: #f5f1dd;
      font: 14.5px/1.55 'KinvtPoppins','Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    #card { height: 100%; }
    #card .tpq-card {
      max-width: none; max-height: 100%; height: 100%;
      border: 0; border-radius: 0; animation: none;
    }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="chrome-mock.js"></script>
  <script>
    chrome.storage.session.set({ pendingQuiz: {
      questions: [
        { id: 'w1', question: 'In which year was the ₹ (Indian Rupee) symbol officially adopted?', options: ['2005','2008','2010','2012'], answer: 2, explanation: 'The symbol was adopted on 15 July 2010.' }
      ],
      title: 'UPSC / Civil Services',
      durationSec: 45, theme: 'dark', glass: 'balanced'
    }});
  </script>
  <script src="../src/ui-core.js"></script>
  <script src="../src/quiz-window.js"></script>
</body>
</html>
