<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kinvt-study — Quiz</title>
  <style>
    /* Bundled Poppins — same local files the sidecar uses. */
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'KinvtPoppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }

    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    /* Nothing but the card. The window's own title bar is drawn by the
       browser and cannot be removed by an extension, so the least-chrome
       result available is to add none of our own: no header, no padding,
       no scrollbars — the card fills the window edge to edge. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1c1b19;
      color: #f5f1dd;
      font: 14.5px/1.55 'KinvtPoppins', 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #card { height: 100%; }
    /* The shared card caps itself at 400px wide and 74vh tall for the
       on-page overlay; in its own window it should use the whole thing. */
    #card .tpq-card {
      max-width: none;
      max-height: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      animation: none;
    }

    .empty {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .empty .ico { width: 40px; height: 40px; color: #f5f1dd; opacity: .8; }
    .empty .ico svg { display: block; width: 100%; height: 100%; }
    .empty p { opacity: .75; margin: 10px 0 16px; }
    .empty button {
      border: 0; border-radius: 9px; padding: 10px 18px; cursor: pointer;
      font: inherit; font-weight: 700; color: #1c1b19;
      background: #f5f1dd;
    }
    .empty button:hover { background: #ffffff; }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="ui-core.js"></script>
  <script src="quiz-window.js"></script>
</body>
</html>
