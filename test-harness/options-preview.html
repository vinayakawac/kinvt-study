<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Pop — Settings Preview</title>
  <link rel="stylesheet" href="../src/options/options.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Quiz Pop Settings</h1>

      <section>
        <h2>Categories</h2>
        <p class="hint">Pick one or more question banks. All questions are bundled offline — no AI, no network calls.</p>
        <div id="category-list" class="category-list"></div>
      </section>

      <section>
        <h2>Periodic popup</h2>
        <label class="row">
          <input type="checkbox" id="auto-popup-toggle" />
          <span>Show a quiz overlay automatically while browsing</span>
        </label>
        <label class="row">
          <span>Every</span>
          <input type="number" id="interval-input" min="5" max="240" step="1" />
          <span>minutes</span>
        </label>
        <div id="permission-row" class="row" hidden>
          <button id="grant-permission-btn" class="primary-btn">Grant permission for auto-popups</button>
          <p class="hint">Needed once so the overlay can appear on the page you're viewing when the timer fires.</p>
        </div>
        <p id="permission-status" class="hint"></p>
      </section>

      <section>
        <h2>Stats</h2>
        <p id="stats-summary" class="hint"></p>
        <button id="reset-stats-btn" class="secondary-btn">Reset stats</button>
      </section>

      <p id="save-status" class="save-status" hidden>Saved</p>
    </div>
  </div>

  <script src="chrome-mock.js"></script>
  <script src="../src/core/browser-api.js"></script>
  <script src="../src/core/categories.js"></script>
  <script src="../src/core/storage.js"></script>
  <script src="../src/options/options.js"></script>
</body>
</html>
